<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sports App</title>
  <link href="./output.css" rel="stylesheet">
</head>
<body class="bg-gray-900">
  <div class="max-w-[1200px] mx-auto">
    <h1 class="text-gray-100 text-3xl text-center font-semibold py-10">
      WELCOME TO SPORTS APP
    </h1>

    <p class="text-gray-300 text-center text-xl mb-10">
      SEARCH ANY TEAM TO INSPECT DETAILS AND ROSTER
    </p>

    <div class="mx-auto w-[70%] bg-white flex justify-between py-3 px-4 rounded-lg gap-3">
      <input type="text" placeholder="Ex.. Arsenal, Barcelona, Chelsea" class="w-full py-2 px-3 border border-transparent rounded-lg">
      <button class="btn">SEARCH</button>
    </div>
  </div>


  <script src="app.js"></script>
</body>
</html>
